<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KESTREL // Crime Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-[#050b14] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black" style="background-color: #050b14; min-height: 100vh;">
    <div id="root">
      <div id="boot-status" style="padding: 24px; font-family: monospace; color: #06b6d4; background: #050b14; min-height: 100vh;">
        <h2>[KESTREL SYSTEM BOOTSTRAP]</h2>
        <p style="color: #94a3b8;">Initializing single-surface tactical command deck...</p>
        <div id="boot-error" style="color: #ef4444; margin-top: 16px;"></div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var errEl = document.getElementById('boot-error');
        if (errEl) {
          errEl.innerHTML = '<h3 style="color:#ef4444">Bootstrap Error: ' + e.message + '</h3><pre style="color:#f87171;font-size:12px;">' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error ? e.error.stack : '') + '</pre>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
